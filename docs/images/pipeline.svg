<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
  <title id="title">NovelForge download pipeline</title>
  <desc id="desc">A link or title enters three engines, runs inside an isolated job sandbox, is verified as a real container, and only then reaches the local library.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121116"/>
      <stop offset="1" stop-color="#0B0B0D"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A181F"/>
      <stop offset="1" stop-color="#141318"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8365D"/>
      <stop offset="1" stop-color="#F9739A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A4453"/>
    </marker>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="460" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1398" height="458" rx="25" fill="none" stroke="#26242B"/>

  <text x="60" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#F5F2EC">From link to verified file</text>
  <text x="60" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="2.4" fill="#8C8594">ONE LOCAL PIPELINE · NO CLOUD · NO TELEMETRY</text>
  <rect x="60" y="104" width="72" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Engines -->
  <rect x="60" y="140" width="356" height="250" rx="16" fill="url(#card)" stroke="#2B2833"/>
  <text x="84" y="174" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="2" fill="#8C8594">ENGINES</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <circle cx="94" cy="210" r="5" fill="#E8365D"/>
    <text x="112" y="215" font-size="16" fill="#F2EEE8">Webnovels</text>
    <text x="112" y="235" font-size="12.5" fill="#8C8594">lncrawl  →  EPUB</text>
    <line x1="84" y1="252" x2="392" y2="252" stroke="#26242B"/>

    <circle cx="94" cy="282" r="5" fill="#C9A227"/>
    <text x="112" y="287" font-size="16" fill="#F2EEE8">Manga</text>
    <text x="112" y="307" font-size="12.5" fill="#8C8594">gallery-dl  →  CBZ</text>
    <line x1="84" y1="324" x2="392" y2="324" stroke="#26242B"/>

    <circle cx="94" cy="354" r="5" fill="#6AA6E8"/>
    <text x="112" y="359" font-size="16" fill="#F2EEE8">E-books</text>
    <text x="112" y="379" font-size="12.5" fill="#8C8594">aget  →  EPUB / PDF</text>
  </g>

  <line x1="428" y1="265" x2="468" y2="265" stroke="#4A4453" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Sandbox -->
  <rect x="480" y="140" width="280" height="250" rx="16" fill="url(#card)" stroke="#2B2833"/>
  <text x="504" y="174" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="2" fill="#8C8594">JOB SANDBOX</text>
  <text x="504" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#F5F2EC">Isolated run</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#B6AEB8">
    <text x="504" y="242">·  own process group</text>
    <text x="504" y="272">·  live stdout / stderr</text>
    <text x="504" y="302">·  pause · resume · cancel</text>
    <text x="504" y="332">·  partial files kept</text>
  </g>

  <line x1="772" y1="265" x2="812" y2="265" stroke="#4A4453" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Verify -->
  <rect x="824" y="140" width="280" height="250" rx="16" fill="url(#card)" stroke="#2B2833"/>
  <text x="848" y="174" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="2" fill="#8C8594">VERIFY</text>
  <text x="848" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#F5F2EC">Container check</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#B6AEB8">
    <text x="848" y="242">·  real ZIP + mimetype</text>
    <text x="848" y="272">·  OCF ordering for books</text>
    <text x="848" y="302">·  rejected files deleted</text>
    <text x="848" y="332">·  failure reason surfaced</text>
  </g>

  <line x1="1116" y1="265" x2="1156" y2="265" stroke="#4A4453" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Library -->
  <rect x="1168" y="140" width="172" height="250" rx="16" fill="url(#card)" stroke="#2B2833"/>
  <text x="1192" y="174" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="2" fill="#8C8594">LIBRARY</text>
  <text x="1192" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#F5F2EC">Local shelf</text>

  <g filter="url(#glow)">
    <circle cx="1212" cy="246" r="6" fill="#4ADE80"/>
  </g>
  <text x="1228" y="251" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#B6AEB8">verified</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#B6AEB8">
    <text x="1192" y="286">EPUB / CBZ / PDF</text>
    <text x="1192" y="316">TOC + metadata</text>
    <text x="1192" y="346">stays on disk</text>
  </g>

  <text x="60" y="428" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#6F6878">NovelForge routes every transfer through an external engine, then refuses to shelve anything it cannot open.</text>
</svg>
