[package]
name = "novelforge"
version = "0.1.0"
description = "Private download studio for webnovels, manga and e-books"
authors = ["NovelForge"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "novelforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
walkdir = "2.5.0"
dirs = "7.0.0"
regex = "1.13.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
httpdate = "1"
thiserror = "2.0.21"
strip-ansi-escapes = "0.2.1"
libc = "0.2.191"
uuid = { version = "1.29.2", features = ["v4"] }
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
url = "2.5.8"
scraper = "0.24"
ego-tree = "0.10"
roxmltree = "0.21"
base64 = "0.22"
ruzstd = "0.9.1"

[dev-dependencies]
serde_json = "1"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
