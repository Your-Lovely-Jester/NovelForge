name: windows-build

# Produces an unsigned NSIS installer without a local Windows VM.
# Trigger it from Actions → windows-build → Run workflow, or push a v* tag.
# Download the artifact named "novelforge-windows" when the job finishes.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # Compiles the Windows-only branches: MoveFileExW, taskkill, and the
      # `#[cfg(windows)]` halves of process control and tool discovery.
      - name: Rust lints (Windows code included)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # NSIS writes one .exe and does not need WiX. It is also the bundler that
      # survives debloated Windows images that disable the Windows Installer
      # service (an MSI would fail there).
      - name: Build NSIS installer
        env:
          # Stamped into the binary; About and diagnostics show it, so a stale
          # installer is identifiable instead of looking like a tool bug.
          NOVELFORGE_COMMIT: ${{ github.sha }}
        run: npm run tauri build -- --bundles nsis

      # The downloaded ZIP is what the README install block expands in the
      # user's Downloads folder, so it carries the engine installer next to the
      # app installer. Saved-page fixtures and test data stay out of it.
      - name: Stage release ZIP
        shell: pwsh
        run: |
          $stage = "release"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" $stage
          Copy-Item "LICENSE" $stage
          $scripts = Join-Path $stage "scripts"
          New-Item -ItemType Directory -Force -Path (Join-Path $scripts "patches") | Out-Null
          Copy-Item scripts/install-tools.ps1 $scripts
          Copy-Item scripts/install-tools.sh $scripts
          Copy-Item scripts/apply-lncrawl-patches.sh $scripts
          Copy-Item scripts/patch_lncrawl_scraper.py $scripts
          Copy-Item scripts/aget.py $scripts
          Copy-Item scripts/patches/*.patch (Join-Path $scripts "patches")

          $lines = foreach ($f in Get-ChildItem "$stage/*.exe") {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $lines | Set-Content -Encoding ascii (Join-Path $stage "SHA256SUMS.txt")
          Get-Content (Join-Path $stage "SHA256SUMS.txt")

      # Upload before the tests so a Windows-only failure cannot throw the ZIP
      # away: the artifact still appears and the job goes red.
      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: novelforge-windows
          path: release/
          if-no-files-found: error
          retention-days: 14

      - name: Rust tests (unit + offline integration)
        run: cargo test --manifest-path src-tauri/Cargo.toml
