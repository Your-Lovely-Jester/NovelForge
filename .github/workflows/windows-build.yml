name: windows-build

# Produces an unsigned NSIS installer without a local Windows VM.
# Trigger it from Actions → windows-build → Run workflow, or push a v* tag.
# Download the artifact named "novelforge-windows-nsis" when the job finishes.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # Compiles the Windows-only branches: MoveFileExW, taskkill, and the
      # `#[cfg(windows)]` halves of process control and tool discovery.
      - name: Rust lints (Windows code included)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # NSIS writes one .exe and does not need WiX. It is also the bundler that
      # survives debloated Windows images that disable the Windows Installer
      # service (an MSI would fail there).
      - name: Build NSIS installer
        env:
          # Stamped into the binary; About and diagnostics show it, so a stale
          # installer is identifiable instead of looking like a tool bug.
          NOVELFORGE_COMMIT: ${{ github.sha }}
        run: npm run tauri build -- --bundles nsis

      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          if (-not $files) { throw "No installer produced" }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # Upload before the tests so a Windows-only test failure cannot throw the
      # installer away: the artifact still appears and the job goes red.
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: novelforge-windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Rust tests (unit + offline integration)
        run: cargo test --manifest-path src-tauri/Cargo.toml
