name: linux-build

# Produces the Linux release ZIP: an AppImage, a .deb and the engine installer.
# Trigger it from Actions → linux-build → Run workflow, or push a v* tag.
# Tag pushes also attach novelforge-linux.zip to the GitHub Release; manual runs
# keep the artifact named "novelforge-linux".

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build AppImage and deb
        env:
          # Stamped into the binary; About and diagnostics show it, so a stale
          # build is identifiable instead of looking like a tool bug.
          NOVELFORGE_COMMIT: ${{ github.sha }}
        run: npm run tauri build -- --bundles appimage,deb

      # The downloaded ZIP is what the README install block expands in the
      # user's Downloads folder, so it carries the engine installer next to the
      # app bundles. Saved-page fixtures and test data stay out of it.
      - name: Stage release ZIP
        run: |
          set -euo pipefail
          mkdir -p release/scripts/patches
          cp src-tauri/target/release/bundle/appimage/*.AppImage release/
          cp src-tauri/target/release/bundle/deb/*.deb release/
          cp LICENSE release/
          cp scripts/install-tools.sh scripts/install-tools.ps1 \
             scripts/apply-lncrawl-patches.sh scripts/patch_lncrawl_scraper.py \
             scripts/aget.py scripts/install-linux-desktop.sh release/scripts/
          cp scripts/patches/*.patch release/scripts/patches/
          (cd release && sha256sum *.AppImage *.deb > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      # The artifact keeps a failed-tag build inspectable; the ZIP is what the
      # release attaches for people who are not signed in to GitHub.
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: novelforge-linux
          path: release/
          if-no-files-found: error
          retention-days: 14

      - name: Package release ZIP
        run: |
          set -euo pipefail
          (cd release && zip -r -9 ../novelforge-linux.zip .)
          ls -lh novelforge-linux.zip

      # Tag pushes publish the ZIP on the release; manual runs only keep the
      # artifact above.
      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: novelforge-linux.zip
          fail_on_unmatched_files: true

      - name: Rust tests (unit + offline integration)
        run: cargo test --manifest-path src-tauri/Cargo.toml
